# prometheus.yml - Prometheus configuration for ChessPlayerAnalyzer monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chess-analyzer-monitor'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # FastAPI application metrics
  - job_name: 'chess-analyzer-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_timeout: 5s
    honor_labels: true

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'

  # Nginx metrics (requires nginx-prometheus-exporter)
  - job_name: 'nginx'
    scrape_interval: 15s
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'

  # Docker/Container metrics (requires cAdvisor)
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  # Node/System metrics (requires node_exporter)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'

  # Celery metrics (custom exporter or built-in)
  - job_name: 'celery'
    scrape_interval: 15s
    static_configs:
      - targets: ['celery-exporter:9540']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # Jaeger metrics
  - job_name: 'jaeger'
    scrape_interval: 15s
    static_configs:
      - targets: ['jaeger:14269']
    metrics_path: '/metrics'