# docker-compose.yml  (Compose V2, sin clave 'version')
services:
# ──────────────────────────────────────────────────────────────
  # Application Performance Monitoring (APM) - Jaeger
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"  # UI web
      - "6831:6831/udp"  # Thrift compact protocol (agent)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chessdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chessdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

# ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

# ──────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-base
    command: ["python", "-m", "app.init_db"]
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chessdb
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dev"]

# ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./alembic/versions:/app/alembic/versions
      - ./archives:/app/archives
      - ./debug_results:/app/debug_results
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chessdb
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_DEPTH: 12
      ENABLE_TRACING: "true"
      OTEL_SERVICE_NAME: chess-analyzer-api
      OTEL_EXPORTER_JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_JAEGER_AGENT_PORT: 6831
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["dev"]

# ──────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-base
    command: celery -A app.celery_app worker --loglevel=info -Q default
    volumes:
      - ./app:/app/app
      - ./debug_results:/app/debug_results
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chessdb
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_DEPTH: 12
      ENABLE_TRACING: "true"
      OTEL_SERVICE_NAME: chess-analyzer-worker
      OTEL_EXPORTER_JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_JAEGER_AGENT_PORT: 6831
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["dev"]
  # celery-torch service added below


  celery-torch:
    build:
      context: .
      dockerfile: Dockerfile
      target: torch
      args:
        PYTORCH_IMAGE: pytorch/pytorch:2.3.1-cpu-py3.12
    command: celery -A app.celery_app worker --loglevel=info -Q torch
    volumes:
      - ./app:/app/app
      - ./debug_results:/app/debug_results
      - ./model_store:/app/model_store
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chessdb
      REDIS_URL: redis://redis:6379/0
      ENABLE_TRACING: "true"
      OTEL_SERVICE_NAME: chess-analyzer-torch
      OTEL_EXPORTER_JAEGER_AGENT_HOST: jaeger
      OTEL_EXPORTER_JAEGER_AGENT_PORT: 6831
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["ml"]

# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
